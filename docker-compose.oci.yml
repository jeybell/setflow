# OCI 서버에서 백엔드를 상시 구동할 때 쓰는 compose 파일 (Fly.io 대체).
# DB는 Supabase(운영과 동일)를 그대로 쓰고, 로컬 postgres 컨테이너는 띄우지 않는다.
# HTTPS 노출은 Cloudflare Quick Tunnel(무료, 도메인 불필요)을 사용한다.
# ⚠️ Quick Tunnel 주소(https://xxxx.trycloudflare.com)는 컨테이너가 재시작될 때마다 바뀐다.
#    배포(재시작) 후에는 `docker logs sheet-music-tunnel-oci`에서 새 주소를 확인해
#    Vercel의 VITE_API_BASE_URL 환경변수를 수동으로 갱신해야 한다.
# 사용법: docker compose --env-file .env.oci -f docker-compose.oci.yml up -d --build
services:
  backend:
    build: .
    container_name: sheet-music-backend-oci
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      PORT: ${PORT:-8080}
      STORAGE_TYPE: ${STORAGE_TYPE:-r2}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      R2_BUCKET: ${R2_BUCKET}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sheet-music-tunnel-oci
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://backend:8080
    depends_on:
      - backend
